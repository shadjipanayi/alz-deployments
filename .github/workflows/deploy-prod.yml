#
# Production deployment
#
# Owner:           DevOps Engineer
# Purpose:         The only permitted route to a customer production environment. Runs in two
#                  stages: an unattended preview stage that produces the what-if output, then a
#                  gated deployment stage that cannot start until two named reviewers approve.
#                  Approvers read the preview produced by stage one before approving stage two.
# Audit relevance: Primary evidence for Control 3.1 - segregation of duties at deployment time,
#                  change impact reviewed before execution, named approvers with timestamps, and a
#                  hashed deployment evidence record retained for 400 days.
#
# Required repository configuration:
#   Variables:    AZURE_TENANT_ID
#                 AZURE_PROD_PREVIEW_CLIENT_ID   (Reader on the production subscription)
#                 AZURE_PROD_CLIENT_ID           (Contributor and User Access Administrator)
#                 AZURE_SUBSCRIPTION_ID_CUSTOMER_A_PROD
#                 AZURE_SUBSCRIPTION_ID_CUSTOMER_B_PROD
#   Environments: production-preview  (no reviewers)
#                 production          (two required reviewers, deployment branches limited to
#                                      protected branches and tags matching v*)
#

name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer to deploy'
        type: choice
        required: true
        options:
          - customer-a
          - customer-b
      changeRequestId:
        description: 'Approved change request identifier, for example CR-0142'
        type: string
        required: true
      deploymentRequestIssue:
        description: 'Deployment request issue number authorising this run, for example 214'
        type: string
        required: true
      releaseTag:
        description: 'Release tag being deployed, for example v1.4.0. Must match the ref this workflow was started from.'
        type: string
        required: true
      confirmation:
        description: 'Type DEPLOY to confirm you have read the rollback plan in the change request'
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  EVIDENCE_DIR: evidence

jobs:

  # -----------------------------------------------------------------------------------------------
  # Stage 0 - refuse to proceed unless the request is well formed and traceable.
  # -----------------------------------------------------------------------------------------------
  authorise:
    name: Authorisation preflight
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.resolve.outputs.label }}
      customerName: ${{ steps.resolve.outputs.customerName }}
      parameterFile: ${{ steps.resolve.outputs.parameterFile }}
      subscriptionVar: ${{ steps.resolve.outputs.subscriptionVar }}
      location: ${{ steps.resolve.outputs.location }}
      deploymentName: ${{ steps.resolve.outputs.deploymentName }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate request and resolve configuration
        id: resolve
        shell: pwsh
        env:
          CUSTOMER: ${{ inputs.customer }}
          CHANGE_REQUEST: ${{ inputs.changeRequestId }}
          DEPLOY_REQUEST: ${{ inputs.deploymentRequestIssue }}
          RELEASE_TAG: ${{ inputs.releaseTag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = New-Object System.Collections.Generic.List[string]

          if ($env:CONFIRMATION -cne 'DEPLOY') {
              $failures.Add('Confirmation text was not exactly "DEPLOY". Re-read the rollback plan in the change request before retrying.')
          }
          if ($env:CHANGE_REQUEST -notmatch '^CR-\d{3,6}$') {
              $failures.Add("Change request '$($env:CHANGE_REQUEST)' is not in the required format CR-####.")
          }
          if ($env:DEPLOY_REQUEST -notmatch '^\d+$') {
              $failures.Add("Deployment request issue '$($env:DEPLOY_REQUEST)' is not a valid issue number.")
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
              $failures.Add("Release tag '$($env:RELEASE_TAG)' is not a semantic version tag of the form vX.Y.Z.")
          }
          if ($env:REF_TYPE -ne 'tag') {
              $failures.Add("This workflow was started from $($env:REF_TYPE) '$($env:REF_NAME)'. Production deployments must be started from a release tag.")
          }
          elseif ($env:REF_NAME -ne $env:RELEASE_TAG) {
              $failures.Add("The workflow ref '$($env:REF_NAME)' does not match the declared release tag '$($env:RELEASE_TAG)'.")
          }

          $configurations = @{
              'customer-a' = [ordered]@{
                  label           = 'customer-a-prod'
                  customerName    = 'Contoso Manufacturing Ltd'
                  parameterFile   = 'parameters/customer-a-prod.json'
                  subscriptionVar = 'AZURE_SUBSCRIPTION_ID_CUSTOMER_A_PROD'
              }
              'customer-b' = [ordered]@{
                  label           = 'customer-b-prod'
                  customerName    = 'Northwind Financial Services plc'
                  parameterFile   = 'parameters/customer-b-prod.json'
                  subscriptionVar = 'AZURE_SUBSCRIPTION_ID_CUSTOMER_B_PROD'
              }
          }

          if (-not $configurations.ContainsKey($env:CUSTOMER)) {
              $failures.Add("Unknown customer '$($env:CUSTOMER)'.")
          }

          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Host "::error::$_" }
              throw 'Authorisation preflight failed. See docs/Change_Management.md.'
          }

          $configuration = $configurations[$env:CUSTOMER]
          $parameters = Get-Content -Path $configuration.parameterFile -Raw | ConvertFrom-Json
          $location = $parameters.parameters.location.value
          $deploymentName = "mig-$($configuration.label)-$($env:GITHUB_RUN_NUMBER)"

          "label=$($configuration.label)"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "customerName=$($configuration.customerName)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "parameterFile=$($configuration.parameterFile)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "subscriptionVar=$($configuration.subscriptionVar)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "location=$location"                                | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "deploymentName=$deploymentName"                    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @(
              '## Production deployment request'
              ''
              '| Field | Value |'
              '|---|---|'
              "| Customer | $($configuration.customerName) |"
              "| Configuration | $($configuration.label) |"
              "| Change request | $($env:CHANGE_REQUEST) |"
              "| Deployment request | #$($env:DEPLOY_REQUEST) |"
              "| Release tag | $($env:RELEASE_TAG) |"
              "| Region | $location |"
              "| Requested by | $($env:GITHUB_ACTOR) |"
              "| Deployment name | $deploymentName |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # -----------------------------------------------------------------------------------------------
  # Stage 1 - produce the what-if preview with a read-only identity. Approvers read this before
  # granting the environment approval that unblocks stage 2.
  # -----------------------------------------------------------------------------------------------
  preview:
    name: Preview production change
    runs-on: ubuntu-latest
    needs: authorise
    environment: production-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PROD_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars[needs.authorise.outputs.subscriptionVar] }}

      - name: Validate deployment
        run: |
          set -euo pipefail
          az deployment sub validate \
            --name "${{ needs.authorise.outputs.deploymentName }}-validate" \
            --location "${{ needs.authorise.outputs.location }}" \
            --subscription "${{ vars[needs.authorise.outputs.subscriptionVar] }}" \
            --template-file bicep/main.bicep \
            --parameters "@${{ needs.authorise.outputs.parameterFile }}" \
            --parameters changeRequestId="${{ inputs.changeRequestId }}" \
                         sourceCommit="${GITHUB_SHA::7}" \
                         deploymentId="${{ github.run_id }}" \
            --only-show-errors

      - name: Preview changes (what-if)
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          az deployment sub what-if \
            --name "${{ needs.authorise.outputs.deploymentName }}" \
            --location "${{ needs.authorise.outputs.location }}" \
            --subscription "${{ vars[needs.authorise.outputs.subscriptionVar] }}" \
            --template-file bicep/main.bicep \
            --parameters "@${{ needs.authorise.outputs.parameterFile }}" \
            --parameters changeRequestId="${{ inputs.changeRequestId }}" \
                         sourceCommit="${GITHUB_SHA::7}" \
                         deploymentId="${{ github.run_id }}" \
            --only-show-errors | tee "${EVIDENCE_DIR}/whatif-${{ needs.authorise.outputs.label }}.txt"

      - name: Publish preview for approvers
        run: |
          {
            echo "## What-if preview — approvers must read this before approving"
            echo ""
            echo "Customer: ${{ needs.authorise.outputs.customerName }}"
            echo "Change request: ${{ inputs.changeRequestId }} · Deployment request: #${{ inputs.deploymentRequestIssue }}"
            echo ""
            echo '```text'
            head -c 40000 "${EVIDENCE_DIR}/whatif-${{ needs.authorise.outputs.label }}.txt"
            echo ""
            echo '```'
            echo ""
            echo "Approve the \`production\` environment only if this preview matches the approved change request."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-whatif-${{ needs.authorise.outputs.label }}-${{ github.run_number }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 400
          if-no-files-found: warn

  # -----------------------------------------------------------------------------------------------
  # Stage 2 - gated deployment. GitHub holds this job until two named reviewers approve the
  # production environment. The approval, the approvers and the timestamps are recorded by GitHub
  # and exported as audit evidence.
  # -----------------------------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - authorise
      - preview
    environment: production
    concurrency:
      group: deploy-prod-${{ needs.authorise.outputs.label }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars[needs.authorise.outputs.subscriptionVar] }}

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          az deployment sub create \
            --name "${{ needs.authorise.outputs.deploymentName }}" \
            --location "${{ needs.authorise.outputs.location }}" \
            --subscription "${{ vars[needs.authorise.outputs.subscriptionVar] }}" \
            --template-file bicep/main.bicep \
            --parameters "@${{ needs.authorise.outputs.parameterFile }}" \
            --parameters changeRequestId="${{ inputs.changeRequestId }}" \
                         sourceCommit="${GITHUB_SHA::7}" \
                         deploymentId="${{ github.run_id }}" \
            --only-show-errors \
            --output json > "${EVIDENCE_DIR}/deployment-${{ needs.authorise.outputs.label }}.json"

          correlation_id="$(jq -r '.properties.correlationId' "${EVIDENCE_DIR}/deployment-${{ needs.authorise.outputs.label }}.json")"
          provisioning_state="$(jq -r '.properties.provisioningState' "${EVIDENCE_DIR}/deployment-${{ needs.authorise.outputs.label }}.json")"
          echo "correlationId=${correlation_id}" >> "${GITHUB_OUTPUT}"
          echo "provisioningState=${provisioning_state}" >> "${GITHUB_OUTPUT}"

      - name: Capture deployment failure detail
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          az deployment operation sub list \
            --name "${{ needs.authorise.outputs.deploymentName }}" \
            --subscription "${{ vars[needs.authorise.outputs.subscriptionVar] }}" \
            --query "[?properties.provisioningState=='Failed'].{resource:properties.targetResource.resourceName, type:properties.targetResource.resourceType, code:properties.statusMessage.error.code, message:properties.statusMessage.error.message}" \
            --output json > "${EVIDENCE_DIR}/failure-${{ needs.authorise.outputs.label }}.json" || true
          echo "::error::Production deployment failed. Review the failure detail artefact and invoke the rollback plan recorded in ${{ inputs.changeRequestId }} if the rollback trigger criteria are met."
          cat "${EVIDENCE_DIR}/failure-${{ needs.authorise.outputs.label }}.json" || true

      - name: Verify deployment
        id: verify
        if: steps.deploy.outcome == 'success'
        shell: pwsh
        run: |
          ./scripts/post-deployment-checks.ps1 `
            -ParameterFile '${{ needs.authorise.outputs.parameterFile }}' `
            -SubscriptionId '${{ vars[needs.authorise.outputs.subscriptionVar] }}' `
            -OutputPath "$env:EVIDENCE_DIR/postdeploy-${{ needs.authorise.outputs.label }}.json"

      - name: Write deployment evidence record
        if: always()
        shell: pwsh
        env:
          CORRELATION_ID: ${{ steps.deploy.outputs.correlationId }}
          PROVISIONING_STATE: ${{ steps.deploy.outputs.provisioningState }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null

          $record = [ordered]@{
              evidenceType           = 'DeploymentRecord'
              control                = '3.1 Repeatable Deployment'
              customer               = '${{ needs.authorise.outputs.customerName }}'
              configuration          = '${{ needs.authorise.outputs.label }}'
              environment            = 'production'
              changeRequestId        = '${{ inputs.changeRequestId }}'
              deploymentRequestIssue = '${{ inputs.deploymentRequestIssue }}'
              releaseTag             = '${{ inputs.releaseTag }}'
              repository             = '${{ github.repository }}'
              gitRef                 = '${{ github.ref }}'
              commitSha              = '${{ github.sha }}'
              workflow               = '${{ github.workflow }}'
              workflowRunId          = '${{ github.run_id }}'
              workflowRunUrl         = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              initiatedBy            = '${{ github.actor }}'
              approvalGate           = 'GitHub Environment "production" - two required reviewers'
              templateFile           = 'bicep/main.bicep'
              parameterFile          = '${{ needs.authorise.outputs.parameterFile }}'
              subscriptionId         = '${{ vars[needs.authorise.outputs.subscriptionVar] }}'
              deploymentName         = '${{ needs.authorise.outputs.deploymentName }}'
              azureCorrelationId     = $env:CORRELATION_ID
              provisioningState      = $env:PROVISIONING_STATE
              postDeploymentCheck    = $env:VERIFY_OUTCOME
              recordedUtc            = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }

          $path = Join-Path $env:EVIDENCE_DIR "deployment-record-${{ needs.authorise.outputs.label }}.json"
          $record | ConvertTo-Json -Depth 5 | Set-Content -Path $path -Encoding utf8

          # Integrity manifest so that the evidence bundle can be proven unaltered at audit time.
          $manifest = Get-ChildItem -Path $env:EVIDENCE_DIR -File | ForEach-Object {
              [ordered]@{
                  file   = $_.Name
                  bytes  = $_.Length
                  sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
              }
          }
          [ordered]@{
              generatedUtc  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              workflowRunId = '${{ github.run_id }}'
              files         = @($manifest)
          } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'manifest.json') -Encoding utf8

          @(
              '## Production deployment record'
              ''
              '| Field | Value |'
              '|---|---|'
          ) + ($record.GetEnumerator() | ForEach-Object { "| $($_.Key) | $($_.Value) |" }) |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-evidence-${{ needs.authorise.outputs.label }}-${{ github.run_number }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 400
          if-no-files-found: warn
